name: Déployer les notifications

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_ID: nous-2-48a67
  PROJECT_NUMBER: "1009106158859"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Vérifier la clé
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::Secret FIREBASE_SERVICE_ACCOUNT absent : déploiement ignoré pour l'instant."
          fi

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22

      - name: Connexion à Google Cloud
        if: env.HAS_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: env.HAS_KEY == 'true'

      - name: Activer les services nécessaires
        if: env.HAS_KEY == 'true'
        run: |
          gcloud services enable \
            calendar-json.googleapis.com \
            cloudfunctions.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com run.googleapis.com \
            eventarc.googleapis.com pubsub.googleapis.com \
            fcm.googleapis.com fcmregistrations.googleapis.com \
            firebaseinstallations.googleapis.com \
            --project "$PROJECT_ID"

      - name: Permissions de construction
        if: env.HAS_KEY == 'true'
        run: |
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/cloudbuild.builds.builder" --condition=None --quiet >/dev/null || true

      - name: Région de la base de données
        if: env.HAS_KEY == 'true'
        run: |
          loc=$(gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format='value(locationId)')
          case "$loc" in
            nam5) region=us-central1 ;;
            eur3) region=europe-west1 ;;
            *) region="$loc" ;;
          esac
          echo "Base Firestore : $loc → fonction : $region"
          echo "ND_REGION=$region" > functions/.env

      - name: Installer
        if: env.HAS_KEY == 'true'
        run: npm ci --prefix functions

      - name: Déployer
        if: env.HAS_KEY == 'true'
        run: |
          set -o pipefail
          deploy() { npx -y firebase-tools@15 deploy --only functions --project "$PROJECT_ID" --force --non-interactive 2>&1 | tee -a "$RUNNER_TEMP/deploy.log"; }
          deploy || { echo "Nouvel essai dans 90 s (première activation)…" | tee -a "$RUNNER_TEMP/deploy.log"; sleep 90; deploy; }

      - name: Diagnostic des fonctions
        if: always() && env.HAS_KEY == 'true'
        run: |
          {
            echo "=== Fonctions installées ==="
            gcloud functions list --project "$PROJECT_ID" --format="table(name,state,environment,location)" 2>&1 || true
            echo "=== Base Firestore ==="
            cat functions/.env 2>/dev/null || true
          } | tee -a "$RUNNER_TEMP/deploy.log"

      - name: Enregistrer le rapport (branche journal)
        if: always() && env.HAS_KEY == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/j"
          { echo "Exécution $GITHUB_RUN_ID — $(date -u) — résultat : ${{ job.status }}"; tail -n 300 "$RUNNER_TEMP/deploy.log" 2>/dev/null; } > "$RUNNER_TEMP/j/rapport.txt"
          cd "$RUNNER_TEMP/j"
          git init -q && git checkout -q -b journal
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add rapport.txt && git commit -q -m "Rapport $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" journal
