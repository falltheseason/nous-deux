name: Déployer les notifications

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_ID: nous-2-48a67
  PROJECT_NUMBER: "1009106158859"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Vérifier la clé
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::Secret FIREBASE_SERVICE_ACCOUNT absent : déploiement ignoré pour l'instant."
          fi

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22

      - name: Connexion à Google Cloud
        if: env.HAS_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: env.HAS_KEY == 'true'

      - name: Activer les services nécessaires
        if: env.HAS_KEY == 'true'
        run: |
          gcloud services enable \
            calendar-json.googleapis.com \
            cloudfunctions.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com run.googleapis.com \
            eventarc.googleapis.com pubsub.googleapis.com \
            fcm.googleapis.com fcmregistrations.googleapis.com \
            firebaseinstallations.googleapis.com \
            --project "$PROJECT_ID"

      - name: Permissions de construction
        if: env.HAS_KEY == 'true'
        run: |
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/cloudbuild.builds.builder" --condition=None --quiet >/dev/null || true

      - name: Région de la base de données
        if: env.HAS_KEY == 'true'
        env:
          CF_ID: ${{ secrets.CF_TURN_KEY_ID }}
          CF_TOKEN: ${{ secrets.CF_TURN_TOKEN }}
        run: |
          loc=$(gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format='value(locationId)')
          case "$loc" in
            nam5) region=us-central1 ;;
            eur3) region=europe-west1 ;;
            *) region="$loc" ;;
          esac
          echo "Base Firestore : $loc → fonction : $region"
          echo "ND_REGION=$region" > functions/.env
          if [ -n "$CF_ID" ] && [ -n "$CF_TOKEN" ]; then
            printf 'CF_TURN_KEY_ID=%s\nCF_TURN_TOKEN=%s\n' "$CF_ID" "$CF_TOKEN" >> functions/.env
            echo "Relais d'appels Cloudflare : configuré"
          else
            echo "Relais d'appels Cloudflare : pas encore configuré"
          fi

      - name: Installer
        if: env.HAS_KEY == 'true'
        run: npm ci --prefix functions

      - name: Déployer
        if: env.HAS_KEY == 'true'
        run: |
          set -o pipefail
          deploy() { npx -y firebase-tools@15 deploy --only functions --project "$PROJECT_ID" --force --non-interactive 2>&1 | tee -a "$RUNNER_TEMP/deploy.log"; }
          deploy || { echo "Nouvel essai dans 90 s (première activation)…" | tee -a "$RUNNER_TEMP/deploy.log"; sleep 90; deploy; }

      - name: Diagnostic des fonctions
        if: always() && env.HAS_KEY == 'true'
        run: |
          {
            echo "=== Fonctions installées ==="
            gcloud functions list --project "$PROJECT_ID" --format="table(name,state,environment,location)" 2>&1 || true
            echo "=== Base Firestore ==="
            grep -v '^CF_TURN_TOKEN' functions/.env 2>/dev/null | sed 's/^CF_TURN_KEY_ID=.*/CF_TURN_KEY_ID=(présent)/' || true
            R=$(sed -n 's/^ND_REGION=//p' functions/.env)
            echo "=== Déclencheurs Eventarc ==="
            gcloud eventarc triggers list --location="$R" --project "$PROJECT_ID" 2>&1 || true
            echo "=== Base Firestore (détails) ==="
            gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format="yaml(locationId,type,databaseEdition)" 2>&1 || true
            echo "=== Rôles du compte de calcul ==="
            gcloud projects get-iam-policy "$PROJECT_ID" --flatten="bindings[].members" --filter="bindings.members:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" --format="value(bindings.role)" 2>&1 || true
            for f in turnCredentials notifierAppel testerNotification; do
              echo "=== Journal $f ==="
              gcloud functions logs read "$f" --region="$R" --project "$PROJECT_ID" --limit=40 2>&1 || true
            done
            echo "=== Journal Eventarc / Cloud Run (erreurs) ==="
            gcloud logging read 'severity>=WARNING AND (resource.type="cloud_run_revision" OR resource.type="eventarc.googleapis.com/trigger" OR protoPayload.serviceName="eventarc.googleapis.com")' --project "$PROJECT_ID" --limit=30 --freshness=1d --format="value(timestamp,severity,textPayload,jsonPayload.message,protoPayload.status.message)" 2>&1 || true
          } | tee -a "$RUNNER_TEMP/deploy.log"

      - name: Enregistrer le rapport (branche journal)
        if: always() && env.HAS_KEY == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/j"
          { echo "Exécution $GITHUB_RUN_ID — $(date -u) — résultat : ${{ job.status }}"; tail -n 300 "$RUNNER_TEMP/deploy.log" 2>/dev/null; } > "$RUNNER_TEMP/j/rapport.txt"
          cd "$RUNNER_TEMP/j"
          git init -q && git checkout -q -b journal
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add rapport.txt && git commit -q -m "Rapport $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" journal
